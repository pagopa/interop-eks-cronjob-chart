# cronjob.image.tag and cronjob.image.digest both absent → the template must fail
# Expected: helm template must return an error with the message:
#   "One of cronjob.image.tag and cronjob.image.digest must be defined."
#
# Note: this test does NOT use base-values.yaml because image.tag must be overridden to null.
#
# helm template charts/interop-eks-cronjob-chart -f tests/general/failure/no-image-tag-or-digest.yaml
#
# Expected: the command must exit with code != 0 and print the expected error message.

name: test-cronjob
namespace: test-ns

serviceAccount:
  roleArn: "arn:aws:iam::123456789012:role/test-role"

cronjob:
  schedule: "0 * * * *"
  image:
    repositoryPrefix: my-registry.example.com
    repositoryName: my-app
    imagePullPolicy: Always
    tag: ~        # null: no tag set
    digest: ~     # null: no digest set
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
