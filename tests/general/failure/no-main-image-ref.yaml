# cronjob.image.tag=null and cronjob.image.digest=null -> explicit fail()
#
# Note: this test does NOT use base-values.yaml because image.tag must be
#       explicitly overridden to null (Helm merge does not allow it via a second file).
#
# Expected error:
#   "One of cronjob.image.tag and cronjob.image.digest must be defined."
#
# helm template charts/interop-eks-cronjob-chart -f tests/general/failure/no-main-image-ref.yaml
# Expected: exit code != 0

name: test-cronjob
namespace: test-ns

serviceAccount:
  roleArn: "arn:aws:iam::123456789012:role/test-role"

cronjob:
  schedule: "0 * * * *"
  image:
    repositoryPrefix: my-registry.example.com
    repositoryName: my-app
    imagePullPolicy: Always
    tag: ~
    digest: ~
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  flywayInitContainer:
    create: false
