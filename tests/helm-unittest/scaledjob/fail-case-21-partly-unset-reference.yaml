# A partly unset value would otherwise render a wrong queue URL silently
locals:
  empty: ""
cronjob:
  schedule: ~
  restartPolicy: Never
scaledJob:
  create: true
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "https://sqs.eu-south-1.amazonaws.com/{{ .Values.locals.empty }}/runs.fifo"
