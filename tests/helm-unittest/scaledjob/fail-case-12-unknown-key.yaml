# A typo must not be ignored
cronjob:
  schedule: ~
  restartPolicy: Never
scaledJob:
  create: true
  maxReplicas: 3
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws
      metadata:
        queueURL: https://sqs.eu-south-1.amazonaws.com/123456789012/runs.fifo
        queueLength: "1"
