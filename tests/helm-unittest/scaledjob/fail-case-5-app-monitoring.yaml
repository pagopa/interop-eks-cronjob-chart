# The monitoring Terraform only handles Deployments and CronJobs
cronjob:
  schedule: ~
  restartPolicy: Never
scaledJob:
  create: true
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws
      metadata:
        queueURL: https://sqs.eu-south-1.amazonaws.com/123456789012/runs.fifo
        queueLength: "1"
argocd:
  appMonitoring:
    enable: true
    projectRepositoryURL: https://github.com/pagopa/interop-core-deployment.git
    jobNamespace: argocd
    serviceAccountName: monitoring
    tfEnv: dev
    tfStateBucketKeyPrefix: prefix
