suite: scaledjob
templates:
  - templates/scaledjob.yaml
values:
  - ../common/base.yaml
  - scaledjob-base.yaml

tests:
  - it: renders a KEDA ScaledJob
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledJob
      - isAPIVersion:
          of: keda.sh/v1alpha1
      - equal:
          path: metadata.name
          value: test-cronjob
      - equal:
          path: metadata.namespace
          value: test-namespace
      - equal:
          path: metadata.labels.app
          value: test-cronjob
      - equal:
          path: metadata.annotations["autoscaling.keda.sh/paused"]
          value: "false"

  - it: renders the triggers as written
    asserts:
      - equal:
          path: spec.triggers
          value:
            - type: aws-sqs-queue
              authenticationRef:
                name: keda-aws
              metadata:
                queueURL: https://sqs.eu-south-1.amazonaws.com/123456789012/runs.fifo
                queueLength: "1"
                awsRegion: eu-south-1

  - it: runs the Job configured under cronjob
    asserts:
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 0
      - equal:
          path: spec.jobTargetRef.activeDeadlineSeconds
          value: 3600
      - equal:
          path: spec.jobTargetRef.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.jobTargetRef.template.spec.serviceAccountName
          value: test-cronjob
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].image
          value: docker.io/library/busybox:1.36.1
      - equal:
          path: spec.jobTargetRef.template.metadata.labels.app
          value: test-cronjob

  - it: runs a fully configured Job unchanged, init container, secrets and volumes included
    values:
      - full-job.yaml
    asserts:
      - equal:
          path: spec.jobTargetRef.activeDeadlineSeconds
          value: 7200
      - equal:
          path: spec.jobTargetRef.template.spec.initContainers[0].name
          value: migrate-db
      - equal:
          path: spec.jobTargetRef.template.spec.initContainers[0].image
          value: docker.io/flyway/flyway:10
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: PLAIN
            value: "yes"
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: TEMPLATED
            value: test-namespace
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: password
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: FROM_CONFIGMAP
            valueFrom:
              configMapKeyRef:
                name: test-cronjob
                key: FROM_CONFIGMAP
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: test-cronjob
      - equal:
          path: spec.jobTargetRef.template.spec.volumes
          value:
            - name: checkout
              emptyDir:
                sizeLimit: 1Gi
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].volumeMounts
          value:
            - name: checkout
              mountPath: /checkout
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 2Gi
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: harvesting

  - it: uses the CronJob history limits instead of KEDA's
    asserts:
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 0
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 1

  - it: uses custom history limits
    values:
      - full-job.yaml
    asserts:
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 2
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 5

  - it: drops null container fields
    asserts:
      - notExists:
          path: spec.jobTargetRef.template.spec.containers[0].env

  - it: lets running Jobs finish when the ScaledJob changes by default
    asserts:
      - equal:
          path: spec.rollout
          value:
            strategy: gradual

  - it: leaves KEDA's scaling defaults when nothing is set
    asserts:
      - notExists:
          path: spec.pollingInterval
      - notExists:
          path: spec.minReplicaCount
      - notExists:
          path: spec.maxReplicaCount
      - notExists:
          path: spec.scalingStrategy

  - it: renders the scaling settings when set
    values:
      - scaling.yaml
    asserts:
      - equal:
          path: metadata.annotations["autoscaling.keda.sh/paused"]
          value: "true"
      - equal:
          path: spec.pollingInterval
          value: 15
      - equal:
          path: spec.minReplicaCount
          value: 0
      - equal:
          path: spec.maxReplicaCount
          value: 3
      - equal:
          path: spec.scalingStrategy
          value:
            strategy: accurate
      - equal:
          path: spec.rollout
          value:
            strategy: immediate
            propagationPolicy: foreground

  - it: renders templated trigger metadata values and authentication name one value at a time
    values:
      - templated-triggers.yaml
    asserts:
      - equal:
          path: spec.triggers[0].authenticationRef.name
          value: keda-aws
      - equal:
          path: spec.triggers[0].metadata
          value:
            queueURL: https://sqs.eu-south-1.amazonaws.com/123456789012/test-cronjob.fifo
            queueLength: "1"
            awsRegion: eu-south-1
            special: "prefix-it's: a # b"
            fallback: fallback
            braces: plain value with {braces}
      - equal:
          path: spec.triggers[0].type
          value: aws-sqs-queue

  - it: leaves settings unset with ~ out, and accepts CronJob-only settings blanked with ""
    values:
      - unset-settings.yaml
    asserts:
      - notExists:
          path: spec.jobTargetRef.activeDeadlineSeconds
      - notExists:
          path: spec.jobTargetRef.template.spec.automountServiceAccountToken
      - notExists:
          path: spec.successfulJobsHistoryLimit
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 1
