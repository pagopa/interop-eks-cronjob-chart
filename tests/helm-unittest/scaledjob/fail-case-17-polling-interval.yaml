# KEDA requires a polling interval of at least one second
cronjob:
  schedule: ~
  restartPolicy: Never
scaledJob:
  create: true
  pollingInterval: 0
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws
      metadata:
        queueURL: https://sqs.eu-south-1.amazonaws.com/123456789012/runs.fifo
        queueLength: "1"
