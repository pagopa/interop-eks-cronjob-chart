# A ScaledJob is paused with scaledJob.paused, not cronjob.suspend
cronjob:
  schedule: ~
  restartPolicy: Never
  suspend: true
scaledJob:
  create: true
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws
      metadata:
        queueURL: https://sqs.eu-south-1.amazonaws.com/123456789012/runs.fifo
        queueLength: "1"
