externalSecrets:
  flywayInitContainer:
    create: true
    refreshPolicy: Interval
    refreshInterval: 30m
    secretStoreRef:
      name: cluster-secret-store
      kind: ClusterSecretStore
    targetSecret:
      name: options-flyway-secret
      creationPolicy: Owner
      deletionPolicy: Delete
    labels:
      team: interop
    annotations:
      example.com/owner: platform
    data:
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: "/apps/{{ .Values.name }}/db"
          property: password
          version: AWSCURRENT
          conversionStrategy: Default
          decodingStrategy: None
