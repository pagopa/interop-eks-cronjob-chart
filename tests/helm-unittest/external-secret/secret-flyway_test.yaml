suite: secret flyway
templates:
  - templates/secret.flyway.yaml
values:
  - ../common/base.yaml

tests:
  - it: does not render Secret Flyway when flywayInitContainer config is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Secret Flyway with default naming convention
    values:
      - secret-flyway.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: apiVersion
          value: v1
      - equal:
          path: metadata.name
          value: test-cronjob-flyway
      - equal:
          path: metadata.namespace
          value: test-namespace
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData
          value: {}
      - matchRegex:
          path: metadata.annotations["externalsecret/secret-data-hash"]
          pattern: "^[a-f0-9]{64}$"

  - it: renders Secret Flyway with custom target secret name
    values:
      - secret-flyway-custom.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: custom-flyway-secret
