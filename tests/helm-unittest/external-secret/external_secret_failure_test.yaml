suite: external secret failures
templates:
  - templates/externalSecret.yaml
  - templates/externalSecret.flyway.yaml
values:
  - ../common/base.yaml

tests:
  - it: fails when app secretStoreRef is missing
    set:
      externalSecrets.app.create: true
    asserts:
      - failedTemplate: {}

  - it: fails when app secretStoreRef.name is empty
    set:
      externalSecrets.app.create: true
      externalSecrets.app.secretStoreRef.name: ""
    asserts:
      - failedTemplate: {}

  - it: fails when app refreshPolicy is invalid
    set:
      externalSecrets.app.create: true
      externalSecrets.app.secretStoreRef.name: cluster-secret-store
      externalSecrets.app.refreshPolicy: Invalid
    asserts:
      - failedTemplate: {}

  - it: fails when app secretKey is not a valid environment variable name
    values:
      - external-secret-invalid.yaml
    asserts:
      - failedTemplate: {}

  - it: fails when app remoteRef.key is missing
    values:
      - external-secret-missing-remote-key.yaml
    asserts:
      - failedTemplate: {}

  - it: fails when Flyway remoteRef contains an unsupported property
    values:
      - external-secret-invalid-flyway.yaml
    asserts:
      - failedTemplate: {}

  - it: fails when Flyway deletionPolicy is invalid
    set:
      cronjob.flywayInitContainer.create: true
      externalSecrets.flywayInitContainer.create: true
      externalSecrets.flywayInitContainer.secretStoreRef.name: cluster-secret-store
      externalSecrets.flywayInitContainer.targetSecret.deletionPolicy: Invalid
    asserts:
      - failedTemplate: {}