externalSecrets:
  flywayInitContainer:
    create: true
    secretStoreRef:
      name: cluster-secret-store
      kind: ClusterSecretStore
    data:
      - secretKey: flyway-db-url
        remoteRef:
          key: "/apps/{{ .Values.name }}/db-url"
      - secretKey: flyway-db-user
        remoteRef:
          key: "/apps/{{ .Values.name }}/db-user"
