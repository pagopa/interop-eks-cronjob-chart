externalSecrets:
  flywayInitContainer:
    create: true
    secretStoreRef:
      name: cluster-secret-store
      kind: ClusterSecretStore
    targetSecret:
      name: custom-flyway-secret
    data:
      - secretKey: FLYWAY_DB_URL
        remoteRef:
          key: "/apps/{{ .Values.name }}/db-url"
