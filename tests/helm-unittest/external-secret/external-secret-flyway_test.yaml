suite: external secret flyway
templates:
  - templates/externalSecret.flyway.yaml
values:
  - ../common/base.yaml

tests:
  - it: does not render ExternalSecret Flyway when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render ExternalSecret Flyway when flywayInitContainer config is disabled
    set:
      externalSecrets.flywayInitContainer.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders ExternalSecret Flyway with default naming convention
    values:
      - external-secret-flyway.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: test-cronjob-flyway
      - equal:
          path: spec.secretStoreRef.name
          value: cluster-secret-store
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: test-cronjob-flyway
      - equal:
          path: spec.data[0].secretKey
          value: FLYWAY_DB_URL
      - equal:
          path: spec.data[0].remoteRef.key
          value: /apps/test-cronjob/db-url
      - equal:
          path: spec.data[1].secretKey
          value: FLYWAY_DB_USER
      - equal:
          path: spec.data[1].remoteRef.key
          value: /apps/test-cronjob/db-user

  - it: renders ExternalSecret Flyway with custom target secret name
    values:
      - external-secret-flyway-custom.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: test-cronjob-flyway
      - equal:
          path: spec.target.name
          value: custom-flyway-secret
