suite: external secret
templates:
  - templates/externalSecret.yaml
values:
  - ../common/base.yaml

tests:
  - it: does not render ExternalSecret when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render ExternalSecret when app config is disabled
    set:
      externalSecrets.app.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders ExternalSecret for app container with fallback target and remote refs
    values:
      - external-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: test-cronjob
      - equal:
          path: spec.secretStoreRef.name
          value: cluster-secret-store
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: fallback-cronjob-secret
      - equal:
          path: spec.data[0].secretKey
          value: username
      - equal:
          path: spec.data[0].remoteRef.key
          value: /apps/test-cronjob/username
      - equal:
          path: spec.data[0].remoteRef.property
          value: username
      - equal:
          path: spec.data[1].secretKey
          value: password
      - equal:
          path: spec.data[1].remoteRef.key
          value: /apps/test-cronjob/password
      - equal:
          path: spec.data[1].remoteRef.property
          value: password

  - it: omits remoteRef.property when not set for app container
    values:
      - external-secret-no-property.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.data[0].secretKey
          value: token
      - equal:
          path: spec.data[0].remoteRef.key
          value: /apps/test-cronjob/token
      - notExists:
          path: spec.data[0].remoteRef.property

  - it: renders app refresh, target policies, metadata and remoteRef options
    values:
      - external-secret-options.yaml
    asserts:
      - equal:
          path: spec.refreshPolicy
          value: Interval
      - equal:
          path: spec.refreshInterval
          value: 1h
      - equal:
          path: spec.target.name
          value: options-app-secret
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.target.deletionPolicy
          value: Delete
      - equal:
          path: metadata.labels.team
          value: interop
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - matchRegex:
          path: spec.target.template.metadata.annotations["externalsecret/secret-applied-hash"]
          pattern: "^[a-f0-9]{64}$"
      - equal:
          path: spec.data[0].remoteRef.key
          value: /apps/test-cronjob/token
      - equal:
          path: spec.data[0].remoteRef.version
          value: AWSCURRENT
      - equal:
          path: spec.data[0].remoteRef.conversionStrategy
          value: Default
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: None
