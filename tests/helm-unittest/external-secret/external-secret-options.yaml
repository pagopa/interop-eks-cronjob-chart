externalSecrets:
  app:
    create: true
    refreshPolicy: Interval
    refreshInterval: 1h
    secretStoreRef:
      name: cluster-secret-store
      kind: ClusterSecretStore
    targetSecret:
      name: options-app-secret
      creationPolicy: Owner
      deletionPolicy: Delete
    labels:
      team: interop
    annotations:
      example.com/owner: platform
    data:
      - secretKey: APP_TOKEN
        remoteRef:
          key: "/apps/{{ .Values.name }}/token"
          property: token
          version: AWSCURRENT
          conversionStrategy: Default
          decodingStrategy: None
