suite: secret app
templates:
  - templates/secret.yaml
values:
  - ../common/base.yaml

tests:
  - it: does not render Secret when app config is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Secret for app container when external secrets are created
    values:
      - secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: apiVersion
          value: v1
      - equal:
          path: metadata.name
          value: test-cronjob
      - equal:
          path: metadata.namespace
          value: test-namespace
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData
          value: {}

  - it: renders Secret with custom target secret name for app container
    values:
      - secret-custom.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: custom-app-secret
