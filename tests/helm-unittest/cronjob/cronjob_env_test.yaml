suite: cronjob env
templates:
  - templates/cronjob.yaml
values:
  - ../common/base.yaml

tests:
  - it: renders main container templated env
    set:
      cronjob.env.TEMPLATED_ENV: "{{ .Values.namespace }}-{{ .Values.name }}"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TEMPLATED_ENV
            value: test-namespace-test-cronjob

  - it: renders main container envFromSecrets with a templated secret address
    set:
      cronjob.envFromSecrets.SECRET_ENV: "{{ .Values.name }}.SECRET_KEY"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: SECRET_ENV
            valueFrom:
              secretKeyRef:
                name: test-cronjob
                key: SECRET_KEY

  - it: renders main container envFromConfigmaps with a templated configmap address
    set:
      cronjob.envFromConfigmaps.CONFIG_ENV: "{{ .Values.name }}.CONFIG_KEY"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CONFIG_ENV
            valueFrom:
              configMapKeyRef:
                name: test-cronjob
                key: CONFIG_KEY

  - it: renders envFrom for app container when external secrets enabled
    values:
      - cronjob-external-secrets-app.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: test-cronjob

  - it: does not render envFrom for app container when external secrets disabled
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom

  - it: does not render envFrom for app container when external secrets data is empty
    set:
      externalSecrets.app.create: true
      externalSecrets.app.secretStoreRef.name: cluster-secret-store
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom

  - it: does not render envFrom for flyway init container when external secrets disabled
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].envFrom

  - it: does not render envFrom for Flyway when external secrets data is empty
    set:
      cronjob.flywayInitContainer.create: true
      externalSecrets.flywayInitContainer.create: true
      externalSecrets.flywayInitContainer.secretStoreRef.name: cluster-secret-store
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].envFrom

  - it: renders envFrom for app container with custom secret name
    values:
      - cronjob-external-secrets-app-custom.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: custom-app-secret

  - it: renders envFrom for flyway init container when external secrets enabled
    values:
      - cronjob-external-secrets-flyway.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].envFrom
          content:
            secretRef:
              name: test-cronjob-flyway

  - it: renders envFrom for flyway init container with custom secret name
    values:
      - cronjob-external-secrets-flyway-custom.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].envFrom
          content:
            secretRef:
              name: custom-flyway-secret

  - it: renders envFrom for both app and flyway containers when both external secrets enabled
    values:
      - cronjob-external-secrets-both.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].envFrom
          content:
            secretRef:
              name: test-cronjob-flyway
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: test-cronjob
