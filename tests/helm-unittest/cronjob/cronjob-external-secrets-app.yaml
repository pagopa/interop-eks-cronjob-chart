cronjob:
  schedule: "0 * * * *"
  image:
    repositoryPrefix: docker.io/library
    repositoryName: busybox
    imagePullPolicy: IfNotPresent
    tag: "1.36.1"
  flywayInitContainer:
    create: false

externalSecrets:
  app:
    create: true
    secretStoreRef:
      name: cluster-secret-store
      kind: ClusterSecretStore
    data:
      - secretKey: APP_KEY
        remoteRef:
          key: "/apps/test-cronjob/app-key"
  flywayInitContainer:
    create: false
