# envFromConfigmaps: value without "." separator → mustRegexSplit produces an array
#            with a single element, causing an index out of range error on the second element.
##
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/failure/env-configmap-no-dot.yaml \
#   | grep "key:" -> must show empty or missing key
#

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    envFromConfigmaps:
      DB_URL: "configmap-name-without-dot-separator"    # wrong format: missing "."
