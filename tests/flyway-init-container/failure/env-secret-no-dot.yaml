# envFromSecrets: value without "." separator
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/failure/env-secret-no-dot.yaml
#
# Must return an error because the format is invalid: missing "." to separate
# secret name and key. The template must fail with an error indicating the wrong format.

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    envFromSecrets:
      DB_PASSWORD: "secret-name-without-dot-separator"    # wrong format: missing "."
