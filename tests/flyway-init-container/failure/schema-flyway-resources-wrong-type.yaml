# flywayInitContainer.resources.requests.cpu set as an integer instead of string
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/failure/schema-flyway-resources-wrong-type.yaml

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    resources:
      requests:
        cpu: 100       # integer instead of string (e.g. "100m") → wrong type
        memory: "128Mi"
      limits:
        cpu: 200       # integer instead of string → wrong type
        memory: "256Mi"
