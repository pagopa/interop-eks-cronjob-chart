# flywayInitContainer.image.tag not set -> uses the default defined in values.yaml ("8.2.3")
# Does not inherit cronjob.image.tag anymore - the official Flyway image default is used.
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/flyway-tag-fallback.yaml
#
# Manual output check (initContainers block):
#   | grep "image:" -> must contain :8.2.3

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
      # tag intentionally not set: uses the "8.2.3" default from values.yaml
    executeFlywayMigrate: true
