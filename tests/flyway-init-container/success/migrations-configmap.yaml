# migrationsConfigmap set -> volumeMount at /flyway/sql + projected volume
# Expected:
#   - initContainer must have volumeMounts with mountPath: /flyway/sql
#   - spec.template.spec.volumes must contain a "migrations-files" projected volume
#     with the configMap "my-migrations-configmap"
#   - INTERNAL_FLYWAY_MIGRATIONS_PATHS must NOT be present in the env
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/ts-13-migrations-configmap.yaml
#
# Manual output check:
#   | grep -A3 "volumeMounts"  -> must show mountPath: /flyway/sql
#   | grep -A5 "migrations-files" -> must show projected + configMap: my-migrations-configmap
#   | grep "INTERNAL_FLYWAY_MIGRATIONS_PATHS" -> must NOT appear

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    migrationsConfigmap: my-migrations-configmap
