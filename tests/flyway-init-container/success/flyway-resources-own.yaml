# flywayInitContainer.resources set -> uses its own resource limits
# Expected: the initContainer must have requests.cpu=50m and limits.memory=128Mi
#           (flyway-specific values, NOT the base cronjob values: 100m / 256Mi).
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/flyway-resources-own.yaml
#
# Manual output check (initContainers > resources block):
#   | grep -A6 "resources:" -> must show cpu: 50m and memory: 128Mi (first resources block = initContainer)

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
