# flywayInitContainer.envFromConfigmaps -> configMapKeyRef in the initContainer env block
# Expected: DB_URL variable must appear in the env as a configMapKeyRef
#           with name: db-configmap and key: DATABASE_URL.
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/env-from-configmaps.yaml
#
# Manual output check (initContainers > env block):
#   | grep "DB_URL" -A4 -> must show configMapKeyRef with name: db-configmap, key: DATABASE_URL

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    envFromConfigmaps:
      DB_URL: "db-configmap.DATABASE_URL"
