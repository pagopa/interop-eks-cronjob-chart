# migrationsConfigmap set to empty string ""
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/migrations-configmap-empty.yaml \
#   | grep "migrations-files"  -> must return 0 lines
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/migrations-configmap-empty.yaml \
#   | grep "volumeMounts"      -> must NOT appear in the initContainers block

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    migrationsConfigmap: ""    # empty string: falsy → no volume/volumeMount expected
