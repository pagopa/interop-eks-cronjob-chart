# flywayInitContainer.envFromSecrets -> secretKeyRef in the initContainer env block
# Expected: DB_PASSWORD variable must appear in the env as a secretKeyRef
#           with name: db-secret and key: PASSWORD.
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/env-from-secrets.yaml
#
# Manual output check (initContainers > env block):
#   | grep "DB_PASSWORD" -A4 -> must show secretKeyRef with name: db-secret, key: PASSWORD

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    envFromSecrets:
      DB_PASSWORD: "db-secret.PASSWORD"
