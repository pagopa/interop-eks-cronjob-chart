# migrationPaths set -> INTERNAL_FLYWAY_MIGRATIONS_PATHS present in the env
# Expected: env var INTERNAL_FLYWAY_MIGRATIONS_PATHS must be present with the configured value.
#           No volumeMount must be present on the initContainer.
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/ts-12-migration-paths.yaml
#
# Manual output check:
#   | grep "INTERNAL_FLYWAY_MIGRATIONS_PATHS" -A1 -> must show value: /migrations/v1,/migrations/v2
#   | grep "volumeMounts" -> must NOT appear in the initContainers block

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    migrationPaths: "/migrations/v1,/migrations/v2"
