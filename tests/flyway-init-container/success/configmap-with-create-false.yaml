# migrationsConfigmap set but create=false → "migrations-files" volume is NOT rendered
#            but the field is semantically inconsistent.
# With create=false the entire flywayInitContainer block is skipped,
# so migrationsConfigmap produces neither a volume nor a volumeMount.
# The test verifies that the output does NOT contain any reference to "migrations-files"
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/configmap-with-create-false.yaml
#   | grep "migrations-files"  -> must return 0 lines (volume is not created)

cronjob:
  flywayInitContainer:
    create: false                               # initContainer disabled
    migrationsConfigmap: my-migrations-configmap  # set but silently ignored
    executeFlywayMigrate: true
