# flywayInitContainer.env set -> direct key/value variables in the env block
# Expected: DB_HOST and DB_PORT variables must appear in the initContainer env
#           with direct values (not valueFrom).
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/env-direct.yaml
#
# Manual output check (initContainers > env block):
#   | grep "DB_HOST" -A1 -> must show value: postgres.example.com
#   | grep "DB_PORT" -A1 -> must show value: "5432"

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    env:
      DB_HOST: "postgres.example.com"
      DB_PORT: "5432"
