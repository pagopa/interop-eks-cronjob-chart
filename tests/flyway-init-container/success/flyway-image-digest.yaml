# flywayInitContainer.image.digest set -> used instead of tag, no ":tag" in the flyway image
# Expected: the initContainer image must contain "@sha256:abc123" and NOT ":<tag>".
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/flyway-image-digest.yaml
#
# Manual output check (initContainers block):
#   | grep "image:" -> must contain @sha256:abc123def456 and NOT :8.2.3

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
      digest: "sha256:abc123def456"
    executeFlywayMigrate: true
