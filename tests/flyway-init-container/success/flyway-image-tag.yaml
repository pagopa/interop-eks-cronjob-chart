# flywayInitContainer.image.tag explicitly set -> overrides the default tag ("8.2.3")
# Expected: the initContainer image must contain ":2.5.0" and NOT ":8.2.3".
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/flyway-image-tag.yaml
#
# Manual output check (initContainers block):
#   | grep "image:" -> must contain :2.5.0

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
      tag: "2.5.0"
    executeFlywayMigrate: true
