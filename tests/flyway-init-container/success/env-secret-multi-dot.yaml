# envFromSecrets: value with more than one "." in the key name
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/env-secret-multi-dot.yaml \
#   | grep "key:" -> must show key: SECTION.KEY (not just "KEY")

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    envFromSecrets:
      DB_PASSWORD: "my-secret.SECTION.KEY"    # more than one dot: split on first dot only
