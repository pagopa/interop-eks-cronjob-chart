# migrationsConfigmap and migrationPaths both set but create=false
#
# Expected behavior: exit code 0, no initContainer in the manifest.
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/conflict-with-create-false.yaml
#   -> must complete WITHOUT errors (exit code 0) despite the invalid configuration
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/conflict-with-create-false.yaml \
#   | grep "initContainers"  -> must return 0 lines

cronjob:
  flywayInitContainer:
    create: false                                  # false guard: fail() does NOT trigger
    migrationsConfigmap: my-migrations-configmap   # conflict silently ignored
    migrationPaths: "/migrations/v1"               # conflict silently ignored
    executeFlywayMigrate: true
