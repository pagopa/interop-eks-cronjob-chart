# flywayInitContainer.image.repositoryPrefix explicitly set -> overrides the default ("docker.io")
# Expected: the initContainer image must start with "flyway-registry.example.com/" and NOT "docker.io/".
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/flyway-repository-prefix.yaml
#
# Manual output check (initContainers block):
#   | grep "image:" -> must contain flyway-registry.example.com/

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryPrefix: flyway-registry.example.com
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
