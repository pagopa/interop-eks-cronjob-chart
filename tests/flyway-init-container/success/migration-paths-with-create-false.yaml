# migrationPaths set but create=false → INTERNAL_FLYWAY_MIGRATIONS_PATHS
#            is NOT rendered; the value is silently ignored.
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/migration-paths-with-create-false.yaml \
#   | grep "INTERNAL_FLYWAY_MIGRATIONS_PATHS"  -> must return 0 lines

cronjob:
  flywayInitContainer:
    create: false                               # initContainer disabled
    migrationPaths: "/migrations/v1,/migrations/v2"  # set but silently ignored
    executeFlywayMigrate: true
