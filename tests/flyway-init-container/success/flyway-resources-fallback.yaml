# flywayInitContainer.resources NOT set -> falls back to cronjob.resources
# Expected: the initContainer must have requests.cpu=100m and limits.memory=256Mi
#           (values inherited from cronjob.resources defined in base-values.yaml).
#
# helm template charts/interop-eks-cronjob-chart -f tests/flyway-init-container/base-values.yaml -f tests/flyway-init-container/success/flyway-resources-fallback.yaml
#
# Manual output check (initContainers > resources block):
#   | grep -A6 "resources:" -> must show cpu: 100m and memory: 256Mi (first resources block = initContainer)

cronjob:
  flywayInitContainer:
    create: true
    image:
      repositoryName: interop-flyway-migrations
    executeFlywayMigrate: true
    # resources intentionally not set: must inherit cronjob.resources
