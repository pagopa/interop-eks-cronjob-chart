{{- /*
KEDA ScaledJob, rendered instead of the CronJob when scaledJob.create is true.

It runs the same Job as the CronJob: the Job spec is read back from the rendered
_cronjob.yaml (spec.jobTemplate.spec) instead of being templated a second time.
This was chosen deliberately to add ScaledJob support without a larger refactoring
of the CronJob template into shared named templates, while ScaledJob support was
introduced in a time-constrained window.
*/ -}}
{{- $scaledJob := .Values.scaledJob | default dict }}
{{- if $scaledJob.create }}

{{- /* CronJob-only settings would silently do nothing on a ScaledJob; null and "" count as not set */}}
{{- range $key := list "schedule" "timeZone" "concurrencyPolicy" }}
{{- if index $.Values.cronjob $key }}
{{- fail (printf "cronjob.%s only applies to CronJobs: remove it when scaledJob.create is true." $key) }}
{{- end }}
{{- end }}
{{- if .Values.cronjob.suspend }}
{{- fail "cronjob.suspend only applies to CronJobs: use scaledJob.paused when scaledJob.create is true." }}
{{- end }}
{{- if hasKey ((.Values.cronjob.metadata | default dict).annotations | default dict) "autoscaling.keda.sh/paused" }}
{{- fail "cronjob.metadata.annotations must not set autoscaling.keda.sh/paused when scaledJob.create is true: use scaledJob.paused." }}
{{- end }}
{{- if and .Values.argocd .Values.argocd.appMonitoring .Values.argocd.appMonitoring.enable }}
{{- fail "argocd.appMonitoring is not supported with scaledJob.create: the monitoring Terraform it runs (terraform/k8s-monitoring-argocd-application in pagopa/interop-core-deployment) only handles Deployments and CronJobs." }}
{{- end }}

{{- $cronjob := include (print $.Template.BasePath "/_cronjob.yaml") . | fromYaml }}
{{- if hasKey $cronjob "Error" }}
{{- fail (printf "cannot read the Job spec from the rendered _cronjob.yaml: %s" $cronjob.Error) }}
{{- end }}
{{- $job := $cronjob.spec.jobTemplate.spec }}

{{- /*
Drop unset fields (e.g. an empty env, or a setting set to ~), which the API server would prune anyway.
Inside an include Helm renders an unset value as the text "<no value>", and blanks it only in the final output.
*/}}
{{- $maps := list $job $job.template.spec }}
{{- range $containers := list "initContainers" "containers" }}
{{- range (get $job.template.spec $containers | default list) }}
{{- $maps = append $maps . }}
{{- end }}
{{- end }}

{{- /*
Trigger metadata values and authenticationRef.name support templating, rendered one value at a time
so a rendered value can't change the YAML around it. Every {{ ... .Values ... }} block must render
non-empty, whatever its spacing: an unset reference would otherwise leave e.g. a queue URL silently wrong.
*/}}
{{- $triggers := list }}
{{- range $index, $trigger := $scaledJob.triggers }}
{{- $trigger = deepCopy $trigger }}
{{- $fields := list }}
{{- range $key := keys $trigger.metadata | sortAlpha }}
{{- $fields = append $fields (list (printf "metadata.%s" $key) $trigger.metadata $key) }}
{{- end }}
{{- if $trigger.authenticationRef }}
{{- $fields = append $fields (list "authenticationRef.name" $trigger.authenticationRef "name") }}
{{- end }}
{{- range $field := $fields }}
{{- $path := index $field 0 }}
{{- $parent := index $field 1 }}
{{- $key := index $field 2 }}
{{- $value := index $parent $key }}
{{- range $reference := regexFindAll `\{\{-?[^}]*\.Values[^}]*-?\}\}` $value -1 }}
{{- if not (include "interop-eks-cronjob-chart.render-tpl-value" (dict "value" $reference "context" $)) }}
{{- fail (printf "scaledJob.triggers[%d].%s: %s renders empty." $index $path $reference) }}
{{- end }}
{{- end }}
{{- $_ := set $parent $key (include "interop-eks-cronjob-chart.render-template" (dict "value" $value "context" $)) }}
{{- end }}
{{- $triggers = append $triggers $trigger }}
{{- end }}

{{- /* History limits are the CronJob ones: the chart defaults replace KEDA's, which keep 100 Jobs of each */}}
{{- $spec := dict "jobTargetRef" $job "successfulJobsHistoryLimit" $cronjob.spec.successfulJobsHistoryLimit "failedJobsHistoryLimit" $cronjob.spec.failedJobsHistoryLimit "triggers" $triggers }}
{{- range $key := list "pollingInterval" "minReplicaCount" "maxReplicaCount" }}
{{- $_ := set $spec $key (index $scaledJob $key) }}
{{- end }}
{{- range $key := list "scalingStrategy" "rollout" }}
{{- with (get $scaledJob $key) }}
{{- $_ := set $spec $key . }}
{{- end }}
{{- end }}
{{- /* One cleanup for every map collected above, the ScaledJob settings included */}}
{{- $maps = append $maps $spec }}
{{- range $map := $maps }}
{{- range $key, $value := $map }}
{{- if or (kindIs "invalid" $value) (eq (toString $value) "<no value>") }}
{{- $_ := unset $map $key }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "interop-eks-cronjob-chart.labels" . | nindent 4 }}
  annotations:
    autoscaling.keda.sh/paused: {{ $scaledJob.paused | default false | quote }}
    {{- with $cronjob.metadata.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
